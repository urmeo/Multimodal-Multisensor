[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mms"
version = "1.0.0"
description = "Shared analysis code for the Multimodal-Multisensor longitudinal study"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Urme Bose" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbmake>=1.5", "ipykernel>=6.25"]
notebooks = ["jupyterlab>=4"]

[tool.setuptools]
packages = ["mms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
