name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Validate data & notebooks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate committed data and notebooks
        run: pytest tests/ -q

      - name: Verify group summaries regenerate + reconcile
        run: python pipeline/build_group_summaries.py

  locked:
    name: Reproducible install from hashed lock
    runs-on: ubuntu-latest   # the lock targets x86_64-linux / py3.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install from the pinned, hashed lock
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - name: Test against the locked environment
        run: pytest tests/ -q

  security:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"   # audit the closure the code actually runs in
          pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit --desc
        continue-on-error: true  # advisory-only rollout; remove this line to make CVEs block the build

  # Full notebook execution is opt-in: trigger it from the Actions tab
  # ("Run workflow"). The case-study / group / individual notebooks read data
  # via relative paths; confirm they run top-to-bottom locally, then enable a
  # folder at a time here. nbmake executes each notebook from its own directory.
  execute-notebooks:
    name: Execute notebooks (manual smoke test)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute notebooks
        # --nbmake-kernel=python3 overrides any embedded kernel name so a clean
        # checkout runs regardless of the author's local kernel.
        run: pytest --nbmake --nbmake-kernel=python3 --nbmake-timeout=900 case-study group individual
